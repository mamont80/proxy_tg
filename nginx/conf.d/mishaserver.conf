# значение заголовка Connection для проксирования websocket-соединений
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ----------------------------------------------------------------------
# HTTP (80): ACME-челлендж для certbot + редирект всего трафика на HTTPS
# ----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name mishaserver.ru www.mishaserver.ru web.mishaserver.ru max.mishaserver.ru t.mishaserver.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------------
# HTTPS: mishaserver.ru + www/max -> backend 217.25.219.93:80 (HTTP)
# ----------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mishaserver.ru www.mishaserver.ru max.mishaserver.ru;

    ssl_certificate     /etc/letsencrypt/live/mishaserver.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mishaserver.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://217.25.219.93:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ----------------------------------------------------------------------
# HTTPS: web.mishaserver.ru -> локальный сервис на хосте, порт 8442
# host.docker.internal резолвится в IP хоста (см. extra_hosts в docker-compose.yml)
# ----------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name web.mishaserver.ru;

    # сертификат mishaserver.ru выписан с SAN на web.mishaserver.ru
    ssl_certificate     /etc/letsencrypt/live/mishaserver.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mishaserver.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://host.docker.internal:8442;
        proxy_http_version 1.1;

        # поддержка websocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ----------------------------------------------------------------------
# HTTPS: t.mishaserver.ru -> https://api.telegram.org
# ----------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name t.mishaserver.ru;

    ssl_certificate     /etc/letsencrypt/live/t.mishaserver.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/t.mishaserver.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass https://api.telegram.org;
        proxy_http_version 1.1;

        proxy_ssl_server_name on;
        proxy_ssl_name api.telegram.org;

        proxy_set_header Host api.telegram.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
