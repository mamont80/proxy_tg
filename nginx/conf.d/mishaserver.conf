# значение заголовка Connection для проксирования websocket-соединений
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ----------------------------------------------------------------------
# Ограничение параллельных «тяжёлых» загрузок на t.mishaserver.ru
#
# Ключ limit_conn с пустым значением не учитывается, поэтому обе зоны
# считают только запросы, у которых Content-Length >= 8 цифр (>= 10 МБ).
# Обычные вызовы Bot API и долгий getUpdates под лимит не попадают.
#
# Зачем: каждая заливка до 2 ГБ оседает на диске у Bot API Server — сначала
# временным файлом приёма, потом копией в его рабочем каталоге. На сервере
# свободно ~9 ГБ, поэтому суммарный лимит 2. Если место на диске изменится —
# правится здесь.
# ----------------------------------------------------------------------
map $content_length $tg_big_upload_ip {
    default        "";
    "~^[0-9]{8,}$" $binary_remote_addr;
}

map $content_length $tg_big_upload_all {
    default        "";
    "~^[0-9]{8,}$" "all";
}

limit_conn_zone $tg_big_upload_ip  zone=tg_big_ip:10m;
limit_conn_zone $tg_big_upload_all zone=tg_big_all:1m;

# ----------------------------------------------------------------------
# HTTP (80): ACME-челлендж для certbot + редирект всего трафика на HTTPS
# ----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name mishaserver.ru www.mishaserver.ru web.mishaserver.ru max.mishaserver.ru t.mishaserver.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------------
# HTTPS: mishaserver.ru + www/max -> backend 217.25.219.93:80 (HTTP)
# ----------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mishaserver.ru www.mishaserver.ru max.mishaserver.ru;

    ssl_certificate     /etc/letsencrypt/live/mishaserver.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mishaserver.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://217.25.219.93:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ----------------------------------------------------------------------
# HTTPS: web.mishaserver.ru -> локальный сервис на хосте, порт 8442
# host.docker.internal резолвится в IP хоста (см. extra_hosts в docker-compose.yml)
# ----------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name web.mishaserver.ru;

    # сертификат mishaserver.ru выписан с SAN на web.mishaserver.ru
    ssl_certificate     /etc/letsencrypt/live/mishaserver.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mishaserver.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://host.docker.internal:8442;
        proxy_http_version 1.1;

        # поддержка websocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ----------------------------------------------------------------------
# HTTPS: t.mishaserver.ru -> собственный Local Bot API Server (сервис
# telegram-bot-api), а не публичный api.telegram.org — ради файлов до 2 ГБ.
# ----------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name t.mishaserver.ru;

    ssl_certificate     /etc/letsencrypt/live/t.mishaserver.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/t.mishaserver.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- загрузка больших файлов ---------------------------------------
    # Потолок тела запроса. 2048m == 2 ГБ; при превышении nginx сразу
    # отвечает 413, не читая тело.
    client_max_body_size 2048m;
    # Размер куска, которым тело читается в память перед отправкой в бэкенд.
    # На сервере ~950 МБ RAM, поэтому буфер намеренно маленький.
    client_body_buffer_size 256k;
    # Таймаут между двумя чтениями тела, а не на весь аплоад.
    client_body_timeout 300s;
    send_timeout        300s;

    # Скачивание файлов при работе Bot API Server с флагом --local.
    #
    # В этом режиме getFile возвращает абсолютный путь на диске сервера
    # (/var/lib/telegram-bot-api/<токен>/videos/file_5.mp4), а клиентские
    # библиотеки подставляют его в шаблон {base}/file/bot{token}/{file_path}
    # и получают .../file/bot<токен>//var/lib/telegram-bot-api/... — двойной
    # слэш nginx схлопывает сам (merge_slashes включён по умолчанию).
    # Отдаём такие файлы прямо с диска, минуя Bot API Server: для гигабайтных
    # видео это просто sendfile вместо лишнего проксирования.
    #
    # Каталог примонтирован в nginx только на чтение (docker-compose.yml).
    # Выход за его пределы через ../ невозможен: nginx нормализует URI до
    # сопоставления с location и отвечает 400 на попытку выйти выше корня.
    location ~ "^/file/bot[0-9]+:[A-Za-z0-9_-]+/var/lib/telegram-bot-api/(?<tg_file>.+)$" {
        alias /var/lib/telegram-bot-api/$tg_file;

        # файл забирают один раз, после чего его удаляет tg-files-cleaner
        add_header Cache-Control "no-store" always;
    }

    # Резервный путь: если сервер когда-нибудь запустят без --local, getFile
    # снова начнёт отдавать относительные пути, и скачивание пойдёт сюда.
    # Регулярка выше приоритетнее этого префикса, так что она не перекрыта.
    location /file/ {
        include /etc/nginx/conf.d/proxy-telegram.inc;

        client_max_body_size 1m;
        # ответ может быть огромным — стримим клиенту, не складывая на диск
        proxy_buffering off;
        proxy_max_temp_file_size 0;
    }

    location / {
        include /etc/nginx/conf.d/proxy-telegram.inc;

        # Стримим тело в Bot API Server, а не копим его во временном файле.
        # Бэкенд теперь локальный, защищать его от медленного клиента смысла
        # нет, а вот лишняя запись 2 ГБ на диск при 9 ГБ свободных — есть:
        # копия у Bot API Server всё равно будет.
        proxy_request_buffering off;

        # Не более 2 одновременных больших загрузок с одного IP
        # и не более 2 суммарно — защита от исчерпания места на диске.
        limit_conn tg_big_ip  2;
        limit_conn tg_big_all 2;
    }
}
