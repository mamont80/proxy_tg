# значение заголовка Connection для проксирования websocket-соединений
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ----------------------------------------------------------------------
# Ограничение параллельных «тяжёлых» загрузок на t.mishaserver.ru
#
# Ключ limit_conn с пустым значением не учитывается, поэтому обе зоны
# считают только запросы, у которых Content-Length >= 8 цифр (>= 10 МБ).
# Обычные вызовы Bot API и долгий getUpdates под лимит не попадают.
#
# Зачем: тело запроса до 2 ГБ спулится во временный файл на диске
# (/var/cache/nginx/client_temp внутри контейнера, тот же раздел /dev/vda2).
# На сервере свободно ~9 ГБ, поэтому суммарный лимит 3 => не более ~6 ГБ
# временных файлов в пике. Если место на диске изменится — правится здесь.
# ----------------------------------------------------------------------
map $content_length $tg_big_upload_ip {
    default        "";
    "~^[0-9]{8,}$" $binary_remote_addr;
}

map $content_length $tg_big_upload_all {
    default        "";
    "~^[0-9]{8,}$" "all";
}

limit_conn_zone $tg_big_upload_ip  zone=tg_big_ip:10m;
limit_conn_zone $tg_big_upload_all zone=tg_big_all:1m;

# ----------------------------------------------------------------------
# HTTP (80): ACME-челлендж для certbot + редирект всего трафика на HTTPS
# ----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name mishaserver.ru www.mishaserver.ru web.mishaserver.ru max.mishaserver.ru t.mishaserver.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------------
# HTTPS: mishaserver.ru + www/max -> backend 217.25.219.93:80 (HTTP)
# ----------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mishaserver.ru www.mishaserver.ru max.mishaserver.ru;

    ssl_certificate     /etc/letsencrypt/live/mishaserver.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mishaserver.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://217.25.219.93:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ----------------------------------------------------------------------
# HTTPS: web.mishaserver.ru -> локальный сервис на хосте, порт 8442
# host.docker.internal резолвится в IP хоста (см. extra_hosts в docker-compose.yml)
# ----------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name web.mishaserver.ru;

    # сертификат mishaserver.ru выписан с SAN на web.mishaserver.ru
    ssl_certificate     /etc/letsencrypt/live/mishaserver.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mishaserver.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://host.docker.internal:8442;
        proxy_http_version 1.1;

        # поддержка websocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ----------------------------------------------------------------------
# HTTPS: t.mishaserver.ru -> https://api.telegram.org
# ----------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name t.mishaserver.ru;

    ssl_certificate     /etc/letsencrypt/live/t.mishaserver.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/t.mishaserver.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- загрузка больших файлов ---------------------------------------
    # Потолок тела запроса. 2048m == 2 ГБ; при превышении nginx сразу
    # отвечает 413, не читая тело.
    client_max_body_size 2048m;
    # В памяти держим только этот кусок тела, всё остальное сразу уходит
    # во временный файл на диске. На сервере ~950 МБ RAM, поэтому буфер
    # намеренно маленький: 16 воркеров * 256k = единицы мегабайт.
    client_body_buffer_size 256k;
    # Таймаут между двумя чтениями тела, а не на весь аплоад.
    client_body_timeout 300s;
    send_timeout        300s;

    location / {
        include /etc/nginx/conf.d/proxy-telegram.inc;

        # Принимаем тело целиком (на диск) и только потом открываем
        # соединение к Telegram — медленный клиент не держит апстрим.
        proxy_request_buffering on;

        # Не более 2 одновременных больших загрузок с одного IP
        # и не более 3 суммарно — защита от исчерпания места на диске.
        limit_conn tg_big_ip  2;
        limit_conn tg_big_all 3;
    }

    # Скачивание файлов (https://t.mishaserver.ru/file/bot<token>/<path>).
    # Здесь тела запроса нет, зато ответ может быть огромным, поэтому
    # отдаём его клиенту потоком, не складывая во временный файл.
    location /file/ {
        include /etc/nginx/conf.d/proxy-telegram.inc;

        client_max_body_size 1m;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
    }
}
